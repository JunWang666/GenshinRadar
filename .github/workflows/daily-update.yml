name: Daily update

on:
  schedule:
    # 每天 00:17 UTC = 北京时间 08:17
    - cron: "17 0 * * *"
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install OpenCode
        run: npm install -g opencode-ai

      - name: Run OpenCode
        env:
          # 默认使用 Anthropic；换别的提供商时，修改仓库变量 OPENCODE_MODEL 并提供对应的 API key secret
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL || 'anthropic/claude-sonnet-5-5' }}
          # 启用 OpenCode 内置的 websearch 工具
          OPENCODE_ENABLE_EXA: "1"
        run: |
          opencode run --model "$OPENCODE_MODEL" "$(cat .github/prompts/daily-update.md)"

      - name: Keep only changes to site/data.json
        run: |
          git diff --name-only
          git ls-files --others --exclude-standard
          git restore --worktree -- ':!site/data.json'
          git clean -fd -- ':!site/data.json'

      - name: Validate data
        run: python3 scripts/validate_data.py site/data.json

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then
            echo "No changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          git commit -m "chore: daily data update $(date -u +%Y-%m-%d)"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
