name: Deploy Pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:
  # 由 daily-update.yml 在数据更新后调用（GITHUB_TOKEN 推送的提交不会触发 push 事件）
  workflow_call:

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 取分支最新提交，以包含 update 任务刚推送的数据
          ref: ${{ github.ref }}

      - name: Validate data
        run: python3 scripts/validate_data.py site/data.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
